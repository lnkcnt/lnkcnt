networks:
  lnkcnt:
volumes:
  dbvol:


services:
  maria:
    image: mariadb:latest
    container_name: mariadb
    ports:
      - 3306:3306
    env_file:
      - .env
    volumes:
      - ./sql_init:/docker-entrypoint-initdb.d
      - dbvol:/var/lib/mysql
    networks:
      lnkcnt:
        ipv4_address: 10.89.0.2
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - 8080:80
    networks:
      lnkcnt:
    environment:
      - PMA_HOST=10.89.0.2
  next:
    container_name: next
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      lnkcnt:
    ports:
      - 8080:3000
      - 44300:3000
