networks:
    lnkcnt:
volumes:
    dbvol:


services:
    mariadb:
        image: mariadb:latest
        container_name: mariadb
        ports:
            - 3306:3306
        env_file:
            - .env
        volumes:
            - ./sql_init:/docker-entrypoint-initdb.d
            - dbvol:/var/lib/mysql
        networks:
            - lnkcnt
    adminer:
        image: adminer
        ports:
            - 8080:8080
        environment:
            - ADMINER_DEFAULT_SERVER=mariadb
            - ADMINER_DESIGN='pepa-linha'
        networks:
            - lnkcnt
