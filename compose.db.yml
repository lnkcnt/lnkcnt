networks:
  lnkcnt:
volumes:
  dbvol:


services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    ports:
      - 3306:3306
    env_file:
      - .env
    volumes:
      - ./sql_init:/docker-entrypoint-initdb.d
      - dbvol:/var/lib/mysql
    networks:
      lnkcnt:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - 8080:80
    networks:
      lnkcnt:
    environment:
      - PMA_HOST=mariadb
