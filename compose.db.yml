networks:
  lnkcnt:
volumes:
  dbvol:


services:
  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - ./sql_init:/docker-entrypoint-initdb.d
      - dbvol:/var/lib/postgresql/18/docker
    networks:
      - lnkcnt
