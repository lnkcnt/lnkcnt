volumes:
  postgres:
  valkey:
networks:
  db:

services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - ./sql_init:/docker-entrypoint-initdb.d
      - postgres:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - db
  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
    restart: unless-stopped
    volumes:
      - ./valkey/:/usr/local/etc/valkey/
    networks:
      - db
    command: [ "valkey-server", "/usr/local/etc/valkey/valkey.conf" ]
